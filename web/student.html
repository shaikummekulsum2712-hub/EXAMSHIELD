<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ExamShield - Quiz</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f5fb;color:#1b1d2a}
 .wrap{max-width:560px;margin:0 auto;padding:16px}
 .card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 2px 10px #0001;margin-bottom:14px}
 h1{font-size:20px;margin:6px 0 12px} input[type=text],textarea{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border:1px solid #ccd;border-radius:10px}
 button{font-size:16px;padding:12px 18px;border:0;border-radius:10px;background:#4a5bd8;color:#fff;width:100%;margin-top:10px}
 .opt{display:block;background:#eef0ff;color:#1b1d2a;text-align:left;margin-top:8px}
 .opt.sel{background:#4a5bd8;color:#fff}
 .note{background:#fff4d6;border-left:4px solid #e0a800;padding:10px;border-radius:8px;margin-bottom:10px;display:none}
 small{color:#667}
</style></head><body><div class="wrap">
<div id="join" class="card"><h1>Join the quiz</h1>
 <input id="name" type="text" maxlength="20" placeholder="Your name">
 <button onclick="join()">Start</button><p id="jmsg"><small>Stay on this page during the quiz.</small></p></div>
<div id="quiz" style="display:none">
 <div class="card"><small id="prog"></small><h1 id="title"></h1>
  <div class="note" id="note"></div>
  <div id="qtext" style="font-size:18px;margin-bottom:6px"></div><div id="opts"></div>
  <textarea id="why" rows="2" placeholder="Optional: explain your reasoning" style="margin-top:12px"></textarea>
  <button id="next" onclick="nextQ()">Next</button></div></div>
<div id="done" class="card" style="display:none"><h1>Submitted. Thank you!</h1></div>
</div>
<script>
let me="", exam=null, qi=0, chosen=-1;
let awayAt=null, returnedAt=0, away=false;

function log(tok){ if(!me) return;
  fetch('/api/log',{method:'POST',body:JSON.stringify({name:me,token:tok,q:qi})}).catch(()=>{}); }

// --- behaviour listeners: each one sends a single letter ---
document.addEventListener('copy',()=>log('C'));
document.addEventListener('paste',()=>log('P'));
function leave(){ if(!me||away||!exam) return; away=true; awayAt=Date.now(); log('B'); }
function back(){ if(!away) return; away=false;
  if(Date.now()-awayAt>5000){ log('I'); returnedAt=Date.now(); } else { log('N'); } }
document.addEventListener('visibilitychange',()=>document.hidden?leave():back());
window.addEventListener('blur',leave);
window.addEventListener('focus',back);

async function join(){
  const n=document.getElementById('name').value.trim(); if(!n) return;
  const ex=await (await fetch('/api/exam')).json();
  if(!ex.published){document.getElementById('jmsg').innerHTML='<small>The teacher has not published the quiz yet. Try again in a moment.</small>';return;}
  await fetch('/api/join',{method:'POST',body:JSON.stringify({name:n})}); me=n; exam=ex;
  document.getElementById('join').style.display='none'; document.getElementById('quiz').style.display='block';
  document.getElementById('title').textContent=ex.title; show(); setInterval(poll,1000);
}
function show(){
  const q=exam.questions[qi]; chosen=-1;
  document.getElementById('prog').textContent='Question '+(qi+1)+' of '+exam.questions.length;
  document.getElementById('qtext').textContent=q.q; document.getElementById('why').value='';
  document.getElementById('note').style.display='none';
  const o=document.getElementById('opts'); o.innerHTML='';
  q.options.forEach((t,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=t;
    b.onclick=()=>choose(i,b);o.appendChild(b);});
  document.getElementById('next').textContent=qi==exam.questions.length-1?'Submit':'Next';
}
function choose(i,btn){
  // A = answered within 2.5 s of coming back from another window; otherwise a normal click
  const quick = returnedAt && Date.now()-returnedAt<2500;
  log(quick?'A':'N'); if(quick) returnedAt=0;
  chosen=i; document.querySelectorAll('.opt').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel');
  fetch('/api/answer',{method:'POST',body:JSON.stringify({name:me,q:qi,choice:i})});
}
function nextQ(){ if(qi<exam.questions.length-1){qi++;show();}
  else{document.getElementById('quiz').style.display='none';document.getElementById('done').style.display='block';} }
async function poll(){
  try{ const r=await (await fetch('/api/poll?name='+encodeURIComponent(me))).json();
    if(r.variant){ exam.questions[r.variant.q].q=r.variant.text;
      if(r.variant.q===qi){ document.getElementById('qtext').textContent=r.variant.text;
        const n=document.getElementById('note'); n.textContent='This question was updated by the examiner.'; n.style.display='block'; } }
  }catch(e){}
}
</script></body></html>
